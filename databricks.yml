bundle:
  name: databricks-football

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for every object of this project. Created by `databricks bundle run setup`, not as a resource (see setup/catalog.sql).
    default: football
  warehouse_id:
    description: SQL warehouse that runs the setup SQL.
    lookup:
      warehouse: Serverless Starter Warehouse # every Free Edition workspace has it
  operator:
    description: The person who gets the job's failure emails, and CAN_MANAGE in prod. Defaults to whoever deploys. CI sets it, because there the deployer is the service principal.
    default: ${workspace.current_user.userName}
  prod_service_principal:
    description: Application ID of the service principal that deploys and runs prod. Looked up by name in the prod target.
    default: "" # unused outside prod

scripts:
  setup:
    # One-time setup that a bundle resource can't do on Free Edition: create the catalog.
    content: uv run python setup/run_sql.py setup/catalog.sql
    env:
      SQL_WAREHOUSE_ID: ${var.warehouse_id}
      SQL_PARAM_CATALOG: ${var.catalog}
  grant_prod_access:
    # One-time bootstrap for CI/CD, run by an admin with -t prod: the access the prod service
    # principal needs before its first deploy (see setup/grant_prod_access.py).
    content: uv run python setup/grant_prod_access.py
    env:
      SP_APPLICATION_ID: ${var.prod_service_principal}
      CATALOG: ${var.catalog}
      SECRET_SCOPE: football # the scope src/football/ingest.py reads the API token from

targets:
  # For building: names get a [dev <user>] / dev_<user>_ prefix, and schedules are paused.
  dev:
    mode: development
    default: true
    workspace:
      profile: free-edition # a CLI profile name, never the host: this repo is public

  # The real daily run: unprefixed schemas (landing, bronze, silver, gold), schedule active.
  # Same Free Edition workspace, because Free Edition has only one.
  prod:
    mode: production
    # Prod is what's on main: from any other branch, `bundle deploy -t prod` stops with
    # "not on the right Git branch". `--force` overrides it; `validate` doesn't check it.
    git:
      branch: main
    # GitHub Actions deploys prod as this service principal, and the job and pipeline run as it.
    # Created once by hand (see README); found by name, so its ID isn't in the repo.
    variables:
      prod_service_principal:
        lookup:
          service_principal: github-actions-football
    run_as:
      service_principal_name: ${var.prod_service_principal}
    workspace:
      profile: free-edition
      # Fixed, not ~: the deployment state lives here, and it must be the same for CI and a
      # manual deploy, or a deploy by someone else would create everything a second time.
      root_path: /Workspace/Users/${var.prod_service_principal}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: ${var.prod_service_principal}
        level: CAN_MANAGE
      - user_name: ${var.operator}
        level: CAN_MANAGE
    resources:
      # The landed files are the one thing in prod that can't be rebuilt: a new fetch only gets
      # what the API says today. So the bundle refuses to delete or recreate this volume, in
      # `bundle destroy` and in a deploy. Dev stays free to destroy. Starting over: see README.
      volumes:
        api_responses:
          lifecycle:
            prevent_destroy: true
      # The service principal creates and owns the prod schemas and everything in them, so the
      # operator needs grants to read prod. Owning the catalog isn't enough for that.
      schemas:
        landing:
          grants:
            - principal: ${var.operator}
              privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
        bronze:
          grants:
            - principal: ${var.operator}
              privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
        silver:
          grants:
            - principal: ${var.operator}
              privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
        gold:
          grants:
            - principal: ${var.operator}
              privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
